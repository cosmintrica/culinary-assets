name: Verify Assets and Package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: git diff --exit-code -- assets dist catalog.json docs/catalog.js docs/previews
      - run: npm test
      - run: npm run verify:package
