<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="54 transparent culinary illustrations. Browse ingredients, cookware and utensils. CC0 artwork, PNG and WebP.">
  <title>Culinary Assets | 54 Free Kitchen Illustrations</title>
  <link rel="stylesheet" href="docs/gallery.css">
</head>
<body>
  <header>
    <div class="brand"><img src="assets/webp/stockpot.webp" width="56" height="56" alt=""><div><h1>Culinary Assets</h1><p>54 illustrations · CC0 artwork · AI-generated</p></div></div>
    <a href="https://github.com/cosmintrica/culinary-assets">GitHub</a>
  </header>
  <main>
    <div class="toolbar">
      <label class="search"><span>Search assets</span><input id="search" type="search" placeholder="Tomato, whisk, cuptor…" autocomplete="off"></label>
      <label><span>Category</span><select id="category"><option value="">All categories</option><option value="ingredients">Ingredients</option><option value="produce">Produce</option><option value="staples">Pantry staples</option><option value="cookware">Cookware</option><option value="utensils">Utensils</option><option value="appliances">Appliances</option></select></label>
      <label><span>Preview background</span><select id="background"><option value="checker">Checkerboard</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
    </div>
    <div class="status"><p id="count" aria-live="polite"></p><a href="guide.html">Install & license</a></div>
    <div id="grid" class="grid" data-background="checker"></div>
    <p id="empty" hidden>No assets match this search.</p>
  </main>
  <footer><p>Artwork: <a href="guide.html#art-license">CC0 1.0</a>. Code: <a href="guide.html#code-license">MIT</a>. <a href="guide.html#provenance">Provenance & limitations</a>.</p><nav class="creator" aria-label="Creator links"><span>By Cosmin Trică</span><a href="https://cosmintrica.ro/">cosmintrica.ro</a><a href="https://github.com/cosmintrica">GitHub</a><a href="https://www.linkedin.com/in/cosmintrica/">LinkedIn</a></nav></footer>
  <dialog id="preview">
    <div class="dialog-header"><h2 id="preview-title"></h2><button id="close" type="button" aria-label="Close preview">×</button></div>
    <div id="preview-art" class="preview-art" data-background="checker"><img id="preview-image" width="512" height="512" alt=""></div>
    <p id="preview-meta"></p>
    <div class="actions"><a id="png" class="download" download>Download PNG</a><a id="webp" class="download secondary" download>Download WebP</a></div>
    <label class="import-label">Individual file import<input id="import" readonly></label>
    <button id="copy" class="copy" type="button">Copy import</button><p id="copy-status" role="status"></p>
  </dialog>
  <script src="docs/catalog.js"></script>
  <script src="docs/gallery.js"></script>
</body>
</html>
